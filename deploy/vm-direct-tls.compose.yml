services:
  devmcp-direct-tls:
    image: caddy:2-alpine
    container_name: devmcp-direct-tls
    restart: unless-stopped
    network_mode: host
    environment:
      DEVMCP_DOMAIN: ${DEVMCP_DOMAIN:?Set DEVMCP_DOMAIN to the public hostname}
    volumes:
      - ./vultr-direct.Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/devmcp-caddy-data:/data
      - /srv/devmcp-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
