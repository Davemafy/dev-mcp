# Dedicated DevMCP worker, isolated from Refit volumes and containers.
services:
  devmcp-vm-worker:
    build:
      context: ..
      dockerfile: Dockerfile.vm-worker
    image: devmcp-vm-worker:local
    restart: unless-stopped
    env_file: /etc/devmcp/vm-worker.env
    volumes:
      - /srv/devmcp-workspaces:/workspaces:rw
      # SSH identity stays root-owned on the host; never mounted into workspaces.
      - /etc/devmcp/host-admin:/etc/devmcp/host-admin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # No CPU/RAM throttling: use available host resources on the owner's VM.
    # Linux still enforces real host limits and may OOM-kill runaway processes.
    pids_limit: ${DEVMCP_VM_PIDS:-2048}
    init: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # No inbound ports: worker initiates HTTPS requests to Railway.
