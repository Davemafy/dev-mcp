# Dedicated DevMCP worker, isolated from Refit volumes and containers.
services:
  devmcp-vm-worker:
    build:
      context: ..
      dockerfile: Dockerfile.vm-worker
    image: devmcp-vm-worker:local
    restart: unless-stopped
    env_file: /etc/devmcp/vm-worker.env
    volumes:
      - /srv/devmcp-workspaces:/workspaces:rw
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Keep conservative defaults while sharing this host with Refit.
    # Optional capacity overrides require a deliberate worker-only redeploy.
    cpus: ${DEVMCP_VM_CPUS:-1.0}
    mem_limit: ${DEVMCP_VM_RAM:-1024m}
    memswap_limit: ${DEVMCP_VM_RAM:-1024m}
    pids_limit: ${DEVMCP_VM_PIDS:-128}
    init: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # No inbound ports: worker initiates HTTPS requests to Railway.
