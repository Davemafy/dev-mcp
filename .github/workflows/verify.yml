name: Verify dev-mcp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q main.py auth.py machine.py browser.py host_access.py tests/
      - name: Run local unit and protocol simulations
        run: pytest -q
      - name: Instantiate actual FastMCP HTTP application
        env:
          PUBLIC_BASE_URL: https://example.up.railway.app
          OWNER_PASSWORD: test-only-local-owner-password-long
          TOKEN_SIGNING_SECRET: test-only-signing-secret-at-least-32-characters-long
        run: |
          python - <<'PY'
          from main import build_app
          class FakeSandbox: pass
          app = build_app(machine_factory=FakeSandbox)
          assert app is not None
          print("Real FastMCP HTTP app mounted successfully.")
          PY
      - name: Start the real HTTP server and verify health + OAuth
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:8099
          OWNER_PASSWORD: ci-owner-password-30-characters
          TOKEN_SIGNING_SECRET: ci-signing-secret-with-at-least-32-characters
          E2B_API_KEY: ci-dummy-no-e2b-requests
          PORT: "8099"
        run: |
          set -euo pipefail
          python main.py > /tmp/dev-mcp-startup.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/dev-mcp-startup.log' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8099/health
          curl --fail --silent --show-error http://127.0.0.1:8099/.well-known/oauth-authorization-server
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/mcp)" = "401"
          echo "Real HTTP process, health, OAuth discovery, and unauthorized MCP checks passed."

      - name: Build and smoke-test the Railway Docker image
        run: |
          set -euo pipefail
          docker build --tag dev-mcp:ci .
          # Simulate a new Railway service with NO owner credentials or E2B
          # key configured. It should serve /health, not crash-loop.
          docker run -d --name dev-mcp-ci -p 18099:18099 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18099 \
            -e PORT=18099 dev-mcp:ci
          trap 'docker ps -a --filter name=dev-mcp-ci; docker logs dev-mcp-ci || true; docker rm -f dev-mcp-ci >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 35); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18099/health; then
              READY=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dev-mcp-ci)" = "false" ]; then
              echo "Container exited before it became ready."
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "Docker image never became ready. Container logs follow."
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18099/.well-known/oauth-authorization-server
          curl --fail --silent --show-error http://127.0.0.1:18099/health | grep -q '"e2b_configured":false'
          docker logs dev-mcp-ci | grep -q 'Initial owner login password'
          echo "Railway Docker image boots, provisions OAuth login, and explains missing E2B configuration."
