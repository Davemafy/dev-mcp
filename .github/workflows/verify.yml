name: Verify dev-mcp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q main.py auth.py machine.py browser.py host_access.py workspace_host_access.py entrypoint.py capabilities.py vm_link.py vm_worker.py tests/
      - name: Run local unit and protocol simulations
        run: pytest -q
      - name: Instantiate actual FastMCP HTTP application
        env:
          PUBLIC_BASE_URL: https://example.up.railway.app
          OWNER_PASSWORD: test-only-local-owner-password-long
          TOKEN_SIGNING_SECRET: test-only-signing-secret-at-least-32-characters-long
        run: |
          python - <<'PY'
          from main import build_app
          class FakeSandbox: pass
          app = build_app(machine_factory=FakeSandbox)
          assert app is not None
          print("Real FastMCP HTTP app mounted successfully.")
          PY
      - name: Start the real HTTP server and verify health + OAuth
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:8099
          OWNER_PASSWORD: ci-owner-password-30-characters
          TOKEN_SIGNING_SECRET: ci-signing-secret-with-at-least-32-characters
          E2B_API_KEY: ci-dummy-no-e2b-requests
          PORT: "8099"
        run: |
          set -euo pipefail
          python main.py > /tmp/dev-mcp-startup.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/dev-mcp-startup.log' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8099/health
          curl --fail --silent --show-error http://127.0.0.1:8099/.well-known/oauth-authorization-server
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/mcp)" = "401"
          echo "Real HTTP process, health, OAuth discovery, and unauthorized MCP checks passed."

      - name: Build and smoke-test the Railway Docker image
        run: |
          set -euo pipefail
          docker build --tag dev-mcp:ci .
          # Simulate a new Railway service with NO owner credentials or E2B
          # key configured. It should serve /health, not crash-loop.
          docker run -d --name dev-mcp-ci -p 18099:18099 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18099 \
            -e PORT=18099 dev-mcp:ci
          trap 'docker ps -a --filter name=dev-mcp-ci; docker logs dev-mcp-ci || true; docker rm -f dev-mcp-ci >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 35); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18099/health; then
              READY=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dev-mcp-ci)" = "false" ]; then
              echo "Container exited before it became ready."
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "Docker image never became ready. Container logs follow."
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18099/.well-known/oauth-authorization-server
          curl --fail --silent --show-error http://127.0.0.1:18099/health | grep -q '"e2b_configured":false'
          docker logs dev-mcp-ci | grep -q 'Initial owner login password'
          echo "Railway Docker image boots, provisions OAuth login, and explains missing E2B configuration."
      - name: Build and smoke-test isolated Vultr worker
        run: |
          set -euo pipefail
          docker build -f Dockerfile.vm-worker -t devmcp-vm-worker:ci .
          docker volume create devmcp-vm-ci
          trap 'docker volume rm -f devmcp-vm-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm --name devmcp-vm-test \
            --cap-drop=ALL --cap-add=SETUID --cap-add=SETGID --cap-add=CHOWN --cap-add=DAC_OVERRIDE \
            --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            -v devmcp-vm-ci:/workspaces \
            --entrypoint python3 devmcp-vm-worker:ci -c 'import vm_worker as w; x=w.execute("create",{}); y=w.execute("run",{"worker_id":x["worker_id"],"command":"id -u"}); assert y["exit_code"]==0 and y["stdout"].strip()=="10001", y; assert w.execute("status",{"worker_id":x["worker_id"]})["ready"]; print("VM worker sandbox UID isolation verified")'

      - name: Verify mounted volume survives restart without running app as root
        run: |
          set -euo pipefail
          docker volume create dev-mcp-ssh-ci
          docker run -d --name dev-mcp-volume-ci -p 18100:18100             -v dev-mcp-ssh-ci:/data             -e PUBLIC_BASE_URL=http://127.0.0.1:18100 -e PORT=18100 dev-mcp:ci
          trap 'docker logs dev-mcp-volume-ci || true; docker rm -f dev-mcp-volume-ci >/dev/null 2>&1 || true; docker volume rm dev-mcp-ssh-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:18100/health > /tmp/dev-mcp-volume-health.json; then break; fi
            sleep 1
          done
          grep -q '"host_access_configured":true' /tmp/dev-mcp-volume-health.json
          grep -q '"host_access_volume_mounted":true' /tmp/dev-mcp-volume-health.json
          docker exec -u 10001:10001 dev-mcp-volume-ci python -c             "from pathlib import Path; assert Path('/proc/1/status').read_text().split('Uid:')[1].split()[0]=='10001'; Path('/data/restart-check').write_text('persisted')"
          docker restart dev-mcp-volume-ci
          for attempt in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:18100/health > /dev/null; then break; fi
            sleep 1
          done
          docker exec -u 10001:10001 dev-mcp-volume-ci python -c             "from pathlib import Path; assert Path('/proc/1/status').read_text().split('Uid:')[1].split()[0]=='10001'; assert Path('/data/restart-check').read_text()=='persisted'"
          echo "Persistent Railway volume accessible after restart under non-root application UID."
