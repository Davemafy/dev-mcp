name: One-time branch cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove branches other than main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          done < /tmp/branches.txt
          echo "Branch cleanup completed."
