name: Dev MCP bridge tests

on:
  push:
    branches:
      - feat/browser-railway-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q main.py machine.py browser.py browser_journey.py railway_diagnostics.py
      - name: Run unit and gateway tests
        run: python -m pytest -q
